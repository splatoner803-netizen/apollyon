<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="APOLLYON">
  <title>APOLLYON</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050505'/%3E%3Cpath d='M7 25 16 6 25 25M11 19h10' fill='none' stroke='%23bdbdbd' stroke-width='2'/%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { background: #050505; color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh;
      display: grid; place-items: center;
      background: radial-gradient(ellipse at center, #0b0b0b, #050505 65%);
      color: #bdbdbd; font-family: "Courier New", monospace;
    }
    body::after {
      content: ""; position: fixed; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(0deg, #ffffff03 0 1px, transparent 1px 4px);
    }
    main { width: 100%; padding: 3rem 1.5rem; text-align: center; }
    #login { width: min(100%, 24rem); margin: auto; }
    h1 { margin: 0 0 3.5rem; font-size: 1.125rem; font-weight: 400; letter-spacing: .45em; text-indent: .45em; }
    input {
      display: block; width: min(100%, 17rem); margin: auto;
      border: 0; border-bottom: 1px solid #505050; border-radius: 0;
      padding: .75rem; background: transparent; color: #ddd;
      font: inherit; font-size: 1rem; letter-spacing: .2em; text-align: center;
    }
    input:focus { outline: none; border-bottom-color: #bdbdbd; box-shadow: 0 1px 0 #bdbdbd; }
    button {
      display: block; min-height: 44px; margin: 1.5rem auto 0; padding: .7rem 1.4rem;
      border: 1px solid transparent; background: none; color: #929292;
      font: inherit; font-size: .875rem; letter-spacing: .25em; cursor: pointer;
    }
    button:hover { color: #eee; }
    button:focus-visible { outline: 1px solid #aaa; outline-offset: 4px; }
    #error { min-height: 1.5em; margin: 1.5rem 0 0; color: #c07878; font-size: .875rem; letter-spacing: .15em; }
    #result { max-width: 60rem; margin: auto; animation: appear 1.4s ease both; }
    #result:focus { outline: none; }
    #result-text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 1.125rem; line-height: 2; letter-spacing: .15em; }
    #result-text.coordinates { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem clamp(2rem, 8vw, 6rem); font-size: clamp(1.125rem, 3vw, 1.75rem); letter-spacing: .08em; font-variant-numeric: tabular-nums; }
    .coordinate { white-space: nowrap; padding: .75rem 0; border-top: 1px solid #292929; }
    .axis { color: #808080; }
    .value { color: #dedede; text-shadow: 0 0 18px #ffffff16; }
    @keyframes appear { from { opacity: 0; filter: blur(4px); } to { opacity: 1; filter: blur(0); } }
    @media (prefers-reduced-motion: reduce) { #result { animation: none; } }
    @media (max-width: 360px) { h1 { letter-spacing: .3em; text-indent: .3em; } }
  </style>
</head>
<body>
  <main>
    <section id="login" aria-labelledby="title">
      <h1 id="title">APOLLYON</h1>
      <form id="password-form">
        <input id="password" type="password" aria-label="Password" aria-describedby="error" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
        <button type="submit">ENTER</button>
        <p id="error" role="status" aria-live="polite"></p>
      </form>
    </section>
    <section id="result" hidden tabindex="-1" aria-label="Message">
      <p id="result-text"></p>
    </section>
  </main>
  <script>
    // ==========================================================
    // NUR DIESE ZWEI WERTE ÄNDERN:
    // Passwort: Groß-/Kleinschreibung wird exakt geprüft.
    const PASSWORD = "ABADDON";
    // Text nach dem Passwort. Zwischen den Backticks sind Zeilenumbrüche möglich.
    const TARGET_TEXT = `X : -46784     Y : +67892`;
    // ==========================================================

    const login = document.getElementById("login");
    const result = document.getElementById("result");
    const password = document.getElementById("password");
    const error = document.getElementById("error");

    function submitPassword(value) {
      if (typeof value !== "string") throw new TypeError("Password must be a string.");
      if (!result.hidden) return { status: "unlocked" };
      if (value !== PASSWORD) {
        error.textContent = "ACCESS DENIED";
        password.setAttribute("aria-invalid", "true");
        password.value = "";
        password.focus();
        return { status: "denied" };
      }
      const output = document.getElementById("result-text");
      const coordinates = TARGET_TEXT.match(/^X\s*:\s*([+-]?\d+)\s+Y\s*:\s*([+-]?\d+)$/);
      if (coordinates) {
        output.classList.add("coordinates");
        output.replaceChildren(...["X", "Y"].map((axis, index) => {
          const group = document.createElement("span");
          group.className = "coordinate";
          const label = document.createElement("span");
          label.className = "axis";
          label.textContent = axis + " : ";
          const value = document.createElement("span");
          value.className = "value";
          value.textContent = coordinates[index + 1];
          group.append(label, value);
          return group;
        }));
      } else {
        output.classList.remove("coordinates");
        output.textContent = TARGET_TEXT;
      }
      password.value = "";
      error.textContent = "";
      password.removeAttribute("aria-invalid");
      login.hidden = true;
      result.hidden = false;
      result.focus();
      return { status: "unlocked" };
    }
    document.getElementById("password-form").addEventListener("submit", (event) => {
      event.preventDefault();
      submitPassword(password.value);
    });
    password.addEventListener("input", () => {
      error.textContent = "";
      password.removeAttribute("aria-invalid");
    });
    // Optional browser-agent access uses the exact same password check.
    if (document.modelContext?.registerTool) {
      try {
        Promise.resolve(document.modelContext.registerTool({
          name: "submit_apollyon_password",
          title: "Submit APOLLYON password",
          description: "Submit a password to the visible APOLLYON form.",
          inputSchema: { type: "object", properties: { password: { type: "string" } }, required: ["password"], additionalProperties: false },
          annotations: { readOnlyHint: false, untrustedContentHint: false },
          execute: (input) => submitPassword(input?.password)
        })).catch(() => {});
      } catch (_) {}
    }
  </script>
</body>
</html>
